# ============================================================
# シーン初期配置 設定ファイル (placement.yaml)
# ============================================================
#
# 「ロボット・物体」の最初の置き方をまとめた設定ファイル。
#   robot:    ロボット (HSR) の初期位置
#   objects:  YCB 物体をどこに置くか (家具の上 / 床)
#   people:   人の配置 (この実習では使わない。空のまま)
#
# 部屋は worlds/carrobo.world (4部屋の TidyUp アリーナ):
#   - 外周 8.0 x 8.0 m、壁の高さ 0.6 m。田の字に4部屋 (各 4 x 4 m の正方形)
#   - 仕切り壁のドア開口: x=0 の壁は y -2.6〜-1.4 / 1.4〜2.6、
#                         y=0 の壁は x -2.6〜-1.4 / 1.4〜2.6
#   - Room NW (西上): 片付け1 (引き出し・trofast・長机+トレイ/コンテナ)
#   - Room SW (西下): 片付け2 (ビン2・高い机・本棚2つ目)
#   - Room NE (東上): 探索1 (本棚・ソファ + 床の散乱物体)
#   - Room SE (東下): 探索2 (長机・緑ビン・円形テーブル+椅子 + 床の散乱物体)
#
# 編集後の反映: make down && make up  (configs/ は bind mount なのでリビルド不要)


# ============================================================
# robot: ロボット (HSR) の初期スポーン位置
# ============================================================
#
# 座標:
#   x, y : 水平位置 (m)。部屋の内側 (X:-4〜4, Y:-4〜4) で、
#          家具や仕切り壁と重ならない場所。
#   yaw  : 向き (rad)。0=+X方向, 1.57≈+Y, 3.14≈-X, -1.57≈-Y。

robot:
  x: 1.2
  y: 2.0
  yaw: 0.0    # Room NE で本棚の方 (+X) を向く


# ============================================================
# objects: 物体配置 (YCB オブジェクトのみ)
# ============================================================
#
# 家具の名前: worlds/carrobo.world の <include><name> と一致させること。
#   物を置ける家具と段 (tier):
#     wrc_long_table    : 天板 0.40m (1段)。Room SE の机
#     wrc_long_table_0  : 天板 0.40m (1段)。Room NW の片付け先テーブル
#                         (トレイ・コンテナが乗っているので普段は置かない)
#     wrc_tall_table    : 天板 0.60m (1段)。Room SW
#     wrc_bookshelf     : tier 0=0.06 / 1=0.50 / 2=0.80 / 3=1.05 / 4=2.02 (5段)
#                         Room NE (tier 4 は HSR には高すぎるので通常使わない)
#     wrc_bookshelf_2   : 同上 (5段)。Room SW の西壁ぎわ
#
# 物体の名前: usd/wrs_models のフォルダ名 (ycb_XXX_...)。
#   使える名前の一覧: ls usd/wrs_models | grep ycb
#
# drop_clearance: 天板からこの高さだけ上に出してスポーンし、物理で着地させる。
#
# 書き方:
#   placements:                       # 家具の上に置く
#     <家具名>:
#       - <物体名>                    # 天板の中央に置く
#       - object: <物体名>            # 細かく指定する書き方
#         dx: 0.15                    #   天板中央からの横ズレ (家具ローカル, m)
#         dy: -0.05
#         yaw: 0.3                    #   物体の向き (rad)
#         tier: 1                    #   段番号 (0 = 一番下)
#   floor:                            # 床に直接置く (TidyUp の散らかし用)
#     - object: <物体名>
#       x: 1.8                        #   world 座標 (m)
#       y: 0.3

objects:
  drop_clearance: 0.1

  # --- 床に散らばった物体 (東側の探索エリア: Room NE / Room SE) ---
  floor:
    - object: ycb_011_banana      # Room NE
      x: 2.0
      y: 1.6
    - object: ycb_013_apple       # Room NE (ソファの手前)
      x: 0.8
      y: 2.6
    - object: ycb_004_sugar_box   # Room SE
      x: 1.6
      y: -1.8
    - object: ycb_077_rubiks_cube # Room SE
      x: 3.2
      y: -0.8

  # --- 家具の上の物体 ---
  placements:
    wrc_long_table:        # Room SE の机
      - object: ycb_002_master_chef_can
        dx: -0.3
      - object: ycb_005_tomato_soup_can
        dx: 0.3

    wrc_tall_table:        # Room SW の高い机
      - ycb_017_orange

    wrc_bookshelf:         # Room NE の本棚
      - object: ycb_009_gelatin_box
        tier: 1
      - object: ycb_003_cracker_box
        tier: 2

    wrc_bookshelf_2:       # Room SW の本棚
      - object: ycb_021_bleach_cleanser
        tier: 1
      - object: ycb_017_orange
        tier: 2


# ============================================================
# furniture: 本物のメッシュ家具 (ソファ・椅子)
# ============================================================
#
# 読み込み側: furniture_spawn.py。worlds の家具 (wrc_*) と違い、
# リポジトリ内 usd/ 配下の USD を任意の位置に置ける。
# 向き (upAxis)・単位 (cm/m)・床への吸着は自動補正される。
#
# 各エントリのキー:
#   usd  (必須) : usd/ からの相対パス (例: sofa/Arnold.usd)
#   name (任意) : シーン内の名前
#   x, y (必須) : 置く位置 (m, world 座標)
#   yaw  (任意) : 向き (★度。0=+X, 90=+Y, 180=-X, 270=-Y)
#                 ※ ロボットの yaw (ラジアン) と単位が違うので注意

furniture:
  # Room NE: ソファ (北の壁ぎわ、部屋の中央=南を向く)
  # 元モデルは幅2.55mの大型ソファなので scale 0.7 で約1.8m幅に縮小している。
  - usd: sofa/Arnold.usd
    name: sofa
    x: 2.0
    y: 3.5
    yaw: 0
    scale: 0.7

  # Room SE: 円形テーブル (元直径1.3mを scale 0.85 で約1.1mに縮小) + 椅子 1 脚
  # 椅子は部屋の北東の角に置き、部屋の中央 (南西) を向かせる。
  # この椅子モデルは yaw=0 で座面が南(-Y)向きなので、南西向きは yaw=315。
  - usd: restaurant/round_table/model.usd
    name: round_table
    x: 2.3
    y: -1.5
    scale: 0.85
  - usd: restaurant/dining_chair/model.usd
    name: chair_1
    x: 3.5
    y: -0.4
    yaw: 315
    scale: 0.7


# ============================================================
# people: 人の配置 (この実習では使わない)
# ============================================================
# 人アセットはこのリポジトリに含めていないため、list は空のままにすること。

people:
  list: []
