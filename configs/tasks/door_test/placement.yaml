# ============================================================
# ドア開閉テスト用 初期配置 (door_test/placement.yaml)
# ============================================================
# 家具・壁の無い広い床 (rc26_restaurant.world, floor_only) にドア 1 枚だけを立て、
# ロボットをその正面にスポーンする。物体 (objects) と人 (people) は置かず、
# ドアノブを掴んで開ける動作だけに集中する「ドアがあるだけの環境」。
# この world の床の範囲は概ね X:-7〜8, Y:-6.5〜6.5 (中心付近を使う)。


# ============================================================
# robot: ロボット(HSR)の初期スポーン位置
# ============================================================
# ドア (下の doors: の entrance_door、x=0/y=0) の「引く側」(+X 側) に立たせ、
# ドアの方 (-X 方向) を向かせる。yaw は「ラジアン」なので 3.14 ≈ -X 向き。
# ※このドアは +X 側へ開く(= ロボットに向かって開く)。ノブを回した後は
#   少し後退して扉の進路を空けること(密着したままだと開けない)。
robot:
  x: 1.5
  y: 0.0
  yaw: 3.14


# ============================================================
# doors: ドアノブ付きのドア
# ============================================================
#
# 「ドアノブを掴んで開ける」動作を試すためのドアを置く設定。
# 部品は 3 つで、すべて物理 (PhysX の剛体/関節) でつながっている:
#   枠 (frame)   … 動かないキネマティック剛体の柱2本+梁 (ヒンジの相手)
#   ドア板 (panel)… 枠に「縦軸のヒンジ(回転関節)」で付き、押す/引くと開く
#   ノブ (knob)  … ドア板に「ドア法線まわりの回転関節」で付き、掴んで回せる丸ノブ
# ※ ラッチ(掛け金)は無し。ドア板は軽く押せば開く「簡単な再現」。
#
# 座標:
#   x, y : ドアを立てる位置 (m)。world 座標。この world (floor_only) は壁が無い広い床
#          なので、周りに何も無い原点付近に置く。
#   yaw  : 向き (度)。0 のときドア面は Y 方向に伸び、法線(開く向き)は X。
#
# 省略可の細かい設定 (書かなければ既定値):
#   width: 0.8         ドア板の幅 (m)
#   height: 2.0        ドア板の高さ (m)
#   thickness: 0.04    ドア板の厚み (m)
#   panel_mass: 6.0    ドア板の重さ (kg)。軽いほど押して開けやすい。
#   knob_mass: 0.2     レバーハンドルの重さ (kg)。両面のハンドルをまとめた重さ。
#   open_limit: 120    開ける最大角度 (度)
#   hinge_side: left   ちょうつがい(ヒンジ)の側。left=-Y側 / right=+Y側
#
# ※ ハンドルはドアの両面 (表・裏) に付く。1 本のスピンドル(軸受け)が板を貫通して
#   両面のレバーをつなぐ実物の造りを再現しており、どちら側からでも押し下げて回せる。
#
# ※ 位置がズレていたら x/y/yaw を調整 (configs は bind mount なので
#   make ros2 dev run TASK=door_test で再反映、イメージ再ビルド不要)。

doors:
  - name: entrance_door
    x: 0.0        # 原点付近 (床の中心)。シミュを見ながら調整してください。
    y: 0.0
    yaw: 0        # ドア面が Y 方向に伸び、+X 側から近づく向き
    panel_mass: 9.0   # ドアの重さ(kg)。重いほど慣性が増え、押すのをやめても惰性で動く。
                      # 軽くしたいなら小さく(例 7)、もっと惰性が欲しいなら大きく(例 12)。
                      # ★この行の数値を変えて make ros2 dev run TASK=door_test で即反映
